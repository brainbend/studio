# Groups the automatically generated release notes by label.
changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: Breaking changes
      labels: ["breaking"]
    - title: New features
      labels: ["feature", "enhancement"]
    - title: Fixes
      labels: ["bug"]
    - title: Documentation
      labels: ["documentation"]
    - title: Other changes
      labels: ["*"]

name: Release
# Two ways to publish:
#  - merge to main with a new version in apps/brainbend-studio/Cargo.toml: tags v<version> and builds the release
#  - push a tag like v0.2.0-rc.1 by hand
# Run it by hand from the Actions tab (or `gh workflow run release.yml --ref dev`) for a dry run: it builds every
# platform and keeps the downloads as workflow artifacts, but creates no tag and no release.
# A merge to main whose version already has a tag does nothing.
# This workflow only builds and packages. The tests run in CI (ci.yml) on every push and pull request, so keep main
# protected so that only commits with passing CI reach it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: ${{ github.ref_type != 'tag' }}
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            VERSION=$(scripts/version.sh)
            TAG="v$VERSION-dryrun"
            RELEASE=true
          elif [ "${{ github.ref_type }}" = tag ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            RELEASE=true
          else
            VERSION=$(scripts/version.sh)
            TAG="v$VERSION"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then RELEASE=false; else RELEASE=true; fi
          fi
          case "$VERSION" in *-*) PRE=true ;; *) PRE=false ;; esac
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, tag $TAG, release=$RELEASE, prerelease=$PRE"
  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: |
          df -h /
          python3 -m pip install --quiet --break-system-packages pillow
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          ./scripts/package-macos.sh universal
          cp dist/brainbend-studio-*-macos-universal.dmg "BrainBend-Studio-${{ needs.check.outputs.tag }}-macos-universal.dmg"
          # The in-app updater downloads this zip; the DMG is for first installs.
          ditto -c -k --keepParent "dist/BrainBend Studio.app" "BrainBend-Studio-${{ needs.check.outputs.tag }}-macos-universal.zip"
      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          cargo build --release -p brainbend-studio
          Compress-Archive -Path target/release/brainbend-studio.exe, LICENSE-MIT, LICENSE-APACHE -DestinationPath "BrainBend-Studio-${{ needs.check.outputs.tag }}-windows.zip"
      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          cargo build --release -p brainbend-studio
          tar -czf "BrainBend-Studio-${{ needs.check.outputs.tag }}-linux.tar.gz" -C target/release brainbend-studio -C ../.. LICENSE-MIT LICENSE-APACHE
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: BrainBend-Studio-*
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Sign the downloads
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then echo "The MINISIGN_KEY secret is not set, so the downloads cannot be signed."; exit 1; fi
          sudo apt-get update && sudo apt-get install -y minisign
          KEY="$RUNNER_TEMP/update-key.sec"
          printf '%s\n' "$MINISIGN_KEY" > "$KEY"
          for f in dist/*; do
            minisign -S -s "$KEY" -m "$f" -x "$f.minisig" -t "BrainBend Studio ${{ needs.check.outputs.tag }}"
            # The app only trusts the key built into it, so make sure this signature matches that key.
            minisign -V -p apps/brainbend-studio/update-key.pub -m "$f" -x "$f.minisig"
          done
          rm -f "$KEY"
          ls -la dist
      - name: Keep the signed downloads (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: signed-downloads
          path: dist/*
      - name: Create the release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          if [ "${{ needs.check.outputs.prerelease }}" = true ]; then PRE="--prerelease"; fi
          gh release create "${{ needs.check.outputs.tag }}" dist/* --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "BrainBend Studio ${{ needs.check.outputs.tag }}" --generate-notes $PRE

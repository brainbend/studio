name: Release
# Pushing a tag like v0.1.0 builds the app for macOS, Windows and Linux and attaches the downloads to a GitHub release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Test
        run: cargo test --workspace --release
      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          ./scripts/bundle-macos.sh
          ditto -c -k --keepParent "dist/BrainBend Studio.app" "BrainBend-Studio-${{ github.ref_name }}-macos.zip"
      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          cargo build --release -p brainbend-studio
          Compress-Archive -Path target/release/brainbend-studio.exe, LICENSE-MIT, LICENSE-APACHE -DestinationPath "BrainBend-Studio-${{ github.ref_name }}-windows.zip"
      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          cargo build --release -p brainbend-studio
          tar -czf "BrainBend-Studio-${{ github.ref_name }}-linux.tar.gz" -C target/release brainbend-studio -C ../.. LICENSE-MIT LICENSE-APACHE
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: BrainBend-Studio-*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "BrainBend Studio ${{ github.ref_name }}" --generate-notes

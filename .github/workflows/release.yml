name: Release
# Two ways to publish:
#  - merge to main with a new version in apps/brainbend-studio/Cargo.toml: tags v<version> and builds the release
#  - push a tag like v0.2.0-rc.1 by hand
# A merge to main whose version already has a tag does nothing.
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: ${{ github.ref_type != 'tag' }}
      - id: decide
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            RELEASE=true
          else
            VERSION=$(scripts/version.sh)
            TAG="v$VERSION"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then RELEASE=false; else RELEASE=true; fi
          fi
          case "$VERSION" in *-*) PRE=true ;; *) PRE=false ;; esac
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, tag $TAG, release=$RELEASE, prerelease=$PRE"
  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Test
        run: cargo test --workspace --release
      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: |
          # The tests leave a lot of build output behind, and the DMG needs room: free it first.
          cargo clean
          df -h /
          python3 -m pip install --quiet --break-system-packages pillow
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          ./scripts/package-macos.sh universal
          cp dist/brainbend-studio-*-macos-universal.dmg "BrainBend-Studio-${{ needs.check.outputs.tag }}-macos-universal.dmg"
      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          cargo build --release -p brainbend-studio
          Compress-Archive -Path target/release/brainbend-studio.exe, LICENSE-MIT, LICENSE-APACHE -DestinationPath "BrainBend-Studio-${{ needs.check.outputs.tag }}-windows.zip"
      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          cargo build --release -p brainbend-studio
          tar -czf "BrainBend-Studio-${{ needs.check.outputs.tag }}-linux.tar.gz" -C target/release brainbend-studio -C ../.. LICENSE-MIT LICENSE-APACHE
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: BrainBend-Studio-*
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          if [ "${{ needs.check.outputs.prerelease }}" = true ]; then PRE="--prerelease"; fi
          gh release create "${{ needs.check.outputs.tag }}" dist/* --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "BrainBend Studio ${{ needs.check.outputs.tag }}" --generate-notes $PRE

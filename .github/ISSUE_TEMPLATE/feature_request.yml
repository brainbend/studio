name: Feature request
description: Suggest something new or a change to how something works
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to do?
      description: Describe the task you are trying to get done, not just the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Media Lesson editor
        - Web Lesson editor
        - Import
        - Publishing (HTML5 / SCORM)
        - Player
        - PowerPoint export
        - Accessibility
        - Other

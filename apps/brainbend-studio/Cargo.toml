[package]
name = "brainbend-studio"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
eframe = "0.36.2"
earcutr = "0.5.0"
i_overlay = "9.1"
latex-rust = "3.0.1"
pulldown-latex = "0.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
rfd = "0.17.2"
skrifa = "0.44"
brainbend-doc = { path = "../../crates/doc", features = ["schema"] }
brainbend-fonts = { path = "../../crates/fonts" }
brainbend-import-legacy = { path = "../../crates/import-legacy" }
brainbend-import-pptx = { path = "../../crates/import-pptx" }
brainbend-export-pptx = { path = "../../crates/export-pptx" }
brainbend-export-docx = { path = "../../crates/export-docx" }
brainbend-export-pdf = { path = "../../crates/export-pdf" }
brainbend-publish-html = { path = "../../crates/publish-html" }
brainbend-spell = { path = "../../crates/spell" }
brainbend-video = { path = "../../crates/video" }
brainbend-mcp = { path = "../../crates/mcp" }
ureq = "3"
serde_json = "1.0.154"
semver = "1.0.28"
minisign-verify = "0.3.0"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }
